name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk JobRadar-23845-v2.0.apk
      - name: SHA-256
        run: sha256sum JobRadar-23845-v2.0.apk > JobRadar-23845-v2.0.apk.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JobRadar-23845-APK
          path: |
            JobRadar-23845-v2.0.apk
            JobRadar-23845-v2.0.apk.sha256
          retention-days: 30
